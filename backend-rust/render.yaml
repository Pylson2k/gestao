services:
  - type: web
    name: gestao-rust-api
    runtime: docker
    plan: free
    dockerContext: ./backend-rust
    dockerfilePath: ./backend-rust/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RUST_GATEWAY_SECRET
        sync: false
      - key: PORT
        value: 4000
